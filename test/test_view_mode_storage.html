<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视图模式状态存储测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .test-section {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
        }
        h2 {
            color: #667eea;
            margin-top: 0;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        .btn-danger {
            background: #ff4d4f;
            color: white;
        }
        .btn-danger:hover {
            background: #ff7875;
        }
        .result {
            margin-top: 15px;
            padding: 15px;
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            border-radius: 4px;
        }
        .success {
            border-left-color: #52c41a;
            background: #f6ffed;
        }
        .warning {
            border-left-color: #faad14;
            background: #fffbe6;
        }
        code {
            background: #f0f0f0;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
        }
        .info-box {
            background: #e6f7ff;
            border: 1px solid #91d5ff;
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1>🧪 视图模式状态存储测试</h1>
    
    <div class="test-section">
        <h2>📋 测试说明</h2>
        <div class="info-box">
            <strong>功能需求：</strong>
            <ul>
                <li>✅ 开关状态保存在 sessionStorage 中</li>
                <li>✅ 浏览器刷新时重置（sessionStorage 在页面会话结束时清除）</li>
                <li>✅ 默认为网格视图（'grid'）</li>
                <li>✅ 从别的视图切换回浏览页面时读取开关状态</li>
            </ul>
        </div>
    </div>

    <div class="test-section">
        <h2>🔧 测试操作</h2>
        
        <div>
            <button class="btn-primary" onclick="setViewMode('grid')">设置为网格视图</button>
            <button class="btn-primary" onclick="setViewMode('list')">设置为列表视图</button>
            <button class="btn-danger" onclick="clearViewMode()">清除状态</button>
            <button class="btn-primary" onclick="checkCurrentState()">检查当前状态</button>
        </div>

        <div id="result" class="result">
            <p>点击按钮开始测试...</p>
        </div>
    </div>

    <div class="test-section">
        <h2>📊 测试结果</h2>
        <div id="testResults"></div>
    </div>

    <script>
        const STORAGE_KEY = 'browseViewMode';
        let testLog = [];

        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const entry = `[${timestamp}] ${message}`;
            testLog.push(entry);
            
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = `<p><strong>${message}</strong></p>`;
            resultDiv.className = `result ${type}`;
            
            updateTestResults();
        }

        function updateTestResults() {
            const resultsDiv = document.getElementById('testResults');
            resultsDiv.innerHTML = testLog.map(entry => `<p>${entry}</p>`).join('');
        }

        function setViewMode(mode) {
            sessionStorage.setItem(STORAGE_KEY, mode);
            log(`✅ 已设置视图模式为: ${mode === 'grid' ? '网格视图' : '列表视图'}`, 'success');
            checkCurrentState();
        }

        function clearViewMode() {
            sessionStorage.removeItem(STORAGE_KEY);
            log('🗑️ 已清除视图模式状态', 'warning');
            checkCurrentState();
        }

        function checkCurrentState() {
            const currentMode = sessionStorage.getItem(STORAGE_KEY);
            
            if (!currentMode) {
                log(`ℹ️ 当前状态: 无保存状态，将使用默认值 'grid' (网格视图)`, 'info');
            } else {
                const modeText = currentMode === 'grid' ? '网格视图' : '列表视图';
                log(`ℹ️ 当前状态: '${currentMode}' (${modeText})`, 'info');
            }
            
            // 模拟组件初始化时的行为
            const simulatedMode = currentMode || 'grid';
            const simulatedModeText = simulatedMode === 'grid' ? '网格视图' : '列表视图';
            log(`🔄 模拟组件加载: 将显示 ${simulatedModeText}`, 'success');
        }

        // 页面加载时自动检查状态
        window.addEventListener('load', () => {
            log('🚀 页面加载完成，自动检查状态...', 'info');
            checkCurrentState();
            
            log('💡 提示: 你可以:', 'info');
            log('   1. 点击按钮切换视图模式', 'info');
            log('   2. 刷新页面测试状态是否保留（同一标签页内刷新会保留）', 'info');
            log('   3. 关闭标签页后重新打开测试状态是否重置', 'info');
        });

        // 监听页面卸载事件
        window.addEventListener('beforeunload', () => {
            console.log('页面即将卸载，sessionStorage 将在标签页关闭时清除');
        });
    </script>
</body>
</html>
